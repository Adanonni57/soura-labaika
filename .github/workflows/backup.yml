name: Sauvegarde base SOURA
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installer l'outil de sauvegarde PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exporter la base
        run: pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --no-privileges > backup-$(date +%F).sql
      - name: Conserver la sauvegarde (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: soura-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90